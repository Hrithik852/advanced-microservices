version: '3.8'
services:
  # The Database
  mongo:
    image: mongo:latest
    ports:
      - "27017:27017"

  # The Message Broker
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"   # Port for our Node apps to communicate
      - "15672:15672" # Port for the web UI dashboard

  # The Distributed Tracing Dashboard
  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "16686:16686" # Port for the web UI dashboard
      - "4318:4318"   # Port for our Node apps to send trace data

