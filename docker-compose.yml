services:
  mongo:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"

  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "16686:16686"
      - "4318:4318"

  auth-service:
    build:
      context: ./auth-service
    ports:
      - "5001:5001"
    env_file:
      - ./auth-service/.env
    depends_on:
      - mongo
      - rabbitmq
      - jaeger

volumes:
  mongo_data: